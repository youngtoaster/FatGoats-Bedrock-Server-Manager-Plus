<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="28" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  
  <!-- Isometric Cube -->
  <!-- Top Face -->
  <polygon points="32,8 54,20 32,32 10,20" fill="url(#cubeTop)" />
  <!-- Left Face -->
  <polygon points="10,20 32,32 32,56 10,44" fill="url(#cubeGrad)" />
  <!-- Right Face -->
  <polygon points="32,32 54,20 54,44 32,56" fill="url(#cubeRight)" />
  
  <!-- Bedrock Core / Neon Plus -->
  <path d="M32 24v16M24 32h16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
</svg>